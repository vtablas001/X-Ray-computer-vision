[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xray-computer-vision"
version = "0.1.0"
description = "Prototype FastAPI service and notebook for chest X-ray pneumonia detection."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.100.0",
    "numpy>=1.24.0,<2.0.0",
    "Pillow>=10.0.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    "tensorflow>=2.13.0,<2.19.0",
    "uvicorn>=0.23.0",
]

[project.optional-dependencies]
analysis = [
    "ipykernel>=6.25.0",
    "jupyter>=1.0.0",
    "keras>=3.0.0",
    "matplotlib>=3.7.0",
    "opencv-python>=4.8.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "seaborn>=0.12.0",
]
dev = [
    "httpx>=0.24.0",
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
